server:
  port: 9090

spring:
  application:
    name: splitforce
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme}
            scope:
              - openid
              - email
              - profile
            # PUBLIC_URL is set in AWS, where the request Host is the Lambda URL rather than CloudFront.
            redirect-uri: ${PUBLIC_URL:{baseUrl}}/login/oauth2/code/{registrationId}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:7173}
  auth:
    # HMAC key for the session + OAuth state cookies. Must be at least 32 bytes; set a random one in AWS.
    secret: ${SESSION_SECRET:local-dev-only-session-secret-0123456789}
    cookie-secure: ${COOKIE_SECURE:false}
    session-days: 30
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:local}
    secret-key: ${AWS_SECRET_ACCESS_KEY:local}
    table-prefix: ${DYNAMODB_TABLE_PREFIX:splitforce_}
  seed:
    enabled: ${SEED_ENABLED:true}
    owner-email: vagishyagnik@gmail.com
    owner-name: Vagish Yagnik
  storage:
    mode: ${STORAGE_MODE:local}
    local:
      root: ${STORAGE_LOCAL_ROOT:./data}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:${AWS_REGION:us-east-1}}
      access-key: ${AWS_S3_ACCESS_KEY_ID:}
      secret-key: ${AWS_S3_SECRET_ACCESS_KEY:}
      endpoint: ${AWS_S3_ENDPOINT:}
      prefix: ${AWS_S3_PREFIX:}

logging:
  level:
    org.springframework.security: INFO
    software.amazon.awssdk: WARN
